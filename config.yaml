# discord-llm-friends — project-wide tunables
#
# All values here have defaults baked into src/discord_llm_friends/config.py.
# This file is for overriding those defaults. Missing keys fall back to the
# coded defaults — you don't need a complete file, just the bits you want to
# tune.
#
# A handful of operational knobs (LLM_PROVIDER, DAILY_LIMIT, HISTORY_TURNS)
# also accept env-var overrides; the env var takes precedence over this
# file. See .env.example for those.
#
# This file IS committed. Secrets belong in .env (gitignored).

# LLM provider + model selection ----------------------------------------
llm:
  # One of: gemini | claude | openai. Selects which provider call_llm()
  # routes to. Env override: LLM_PROVIDER.
  provider: gemini

  # Model identifier for each provider. Whichever provider is selected,
  # the corresponding identifier is used.
  models:
    gemini: gemini-flash-latest
    claude: claude-haiku-4-5
    openai: gpt-5.6-terra

  # Failover chain. If the selected provider errors (e.g. a 503 "model is
  # overloaded", a rate limit, or a blocked/empty response), the engine
  # retries the request on the next provider in this list, skipping the
  # one that just failed. With provider=gemini above, the order tried is
  # gemini -> openai -> claude. The substitute provider's own API key must
  # be set in .env for it to take over. Set to [] to disable failover and
  # let the selected provider's error propagate.
  fallback_order: [gemini, openai, claude]

  # Generation knobs applied uniformly across providers.
  temperature: 1
  max_output_tokens: 2000

  # Per-request HTTP timeout (seconds), all providers + embeddings. Caps how
  # long an overloaded provider (e.g. a Gemini 503 that takes ~3 minutes to
  # arrive) can stall a reply before failover moves on to the next provider.
  request_timeout_seconds: 45

# Embeddings (always OpenAI; project decision) --------------------------
embedding:
  model: text-embedding-3-large
  # Embed pipeline batch size. OpenAI accepts much larger; 100 gives useful
  # progress output and bounds blast radius if a single batch fails.
  batch_size: 100
  # Max retries on transient OpenAI errors before giving up.
  max_retries: 5

# Retrieval -------------------------------------------------------------
retrieval:
  # Window/excerpt budget per query (stance cards get their own 2 slots).
  top_k: 4
  # L2-distance floors — hits farther than these are dropped instead of
  # injected as irrelevant filler. Cards are cleaner, so a looser floor than
  # noisy multi-speaker windows. Nothing relevant -> fall back to the dossier.
  # Tune via dev.query_check distances on relevant vs irrelevant queries.
  max_card_distance: 0.80
  max_window_distance: 0.70
  # Added to both floors only on the query-expansion retry (when the first
  # pass found nothing). Accepts a looser match from the neutral rephrasing
  # rather than nothing, while still excluding outright noise (~0.92+).
  expanded_floor_bonus: 0.10

# Synthetic-query generation (doc2query indexing) ---------------------
# Pipeline step between cleanup and embed. For each cleaned-corpus
# entry, asks Gemini for a one-line "what question/topic would prompt
# this comment as a reply?" string. embed then vectorizes THOSE
# strings instead of the original comments, so the runtime embedding
# space is question-shaped (better Hungarian recall). Sidecar:
# personas/<id>/synthetic_queries.json (parallel array, same length
# and order as cleaned.json). See pipeline.synth_queries.
synth_queries:
  batch_size: 20 # comments bundled into one LLM call
  concurrency: 5 # in-flight requests; lower if you see 429s
  max_retries: 5
  output_language: null # null = take from persona.language

# Style examples (per-response random sampling) -----------------------
# On each response the engine draws a fresh random subset of cleaned-
# corpus entries and embeds them in the system prompt.
style:
  # How many cleaned-corpus entries to sample per response. Higher =
  # richer voice exposure; lower = leaner prompt.
  sample_size: 50

# Bot runtime ----------------------------------------------------------
bot:
  # Per-user short-window anti-spam, in seconds.
  rate_limit_seconds: 10
  # Per-user-per-bot daily quota. Env override: DAILY_LIMIT.
  daily_limit_per_user: 50
  # Discord caps single messages at 2000 chars; this is what we'll cut at,
  # leaving headroom so a trailing emoticon never pushes us over.
  max_discord_message_chars: 1900
  # Recent exchanges from THIS channel to surface in the LLM prompt for
  # cross-bot continuity. Env override: HISTORY_TURNS.
  history_turns_in_prompt: 3
  # Echo the user's question as a Discord quote-block at the top of the
  # bot's response. Compensates for Discord no longer showing slash-
  # command invocations as regular channel messages.
  echo_question_in_response: true

# Per-channel conversation history -------------------------------------
history:
  # How many exchanges to keep per channel on disk. The prompt may use
  # fewer (see bot.history_turns_in_prompt). Bounded to prevent unbounded
  # file growth.
  retention_per_channel: 50
  # Cap stored question/response lengths so a runaway prompt can't bloat
  # the history file. Truncation only affects what gets persisted.
  max_question_chars: 1000
  max_response_chars: 2000

# Cleanup pipeline (project-wide defaults) -----------------------------
# Persona-specific overrides (e.g., language-specific quote-block markers
# or system messages) live in personas/<id>/persona.yaml under `cleanup:`.
cleanup:
  # Drop comments shorter than this many words.
  min_words: 4
  # Drop comments that begin and end with a matching quote-mark pair
  # (likely a verbatim quote, not original content).
  drop_pure_quotes: true
