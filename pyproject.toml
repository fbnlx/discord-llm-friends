[project]
name = "discord-llm-friends"
version = "0.1.0"
description = "Template for running Discord bots that impersonate personas through retrieval-augmented few-shot prompting."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.0",
    "chromadb>=1.5.9",
    "discord-py>=2.7.1",
    "google-genai>=2.6.0",
    "openai>=2.38.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_llm_friends"]
